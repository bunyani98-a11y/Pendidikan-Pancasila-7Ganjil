let ME=null,L={};try{ME=JSON.parse(localStorage.getItem('me')||'null')}catch(e){}
const ky=()=>'sc_'+ME.k+ME.n,ld=()=>{L={};try{L=JSON.parse(localStorage.getItem(ky())||'{}')}catch(e){}};if(ME)ld();
const avg=s=>{const v=cols.map(c=>s[c]&&s[c].p).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):'-'};
const tbl=r=>`<div style="overflow-x:auto"><table><tr><th>Nama<th>${cols.join('<th>')}<th>Rata-rata${r.map(x=>`<tr><td>${esc(x.nama)}<td>${cols.map(c=>x.s[c]?x.s[c].p:'-').join('<td>')}<td><b>${avg(x.s)}</b>`).join('')}</table></div><small>F = formatif (F bab.sub bab), S = sumatif per bab. Nilai dalam skala 0–100.</small>`;
const GX={"0.0":{t:"ord",n:"🔢 Urutan",d:["Janji kemerdekaan Koiso (7 Sep 1944)","BPUPK dibentuk (29 Apr 1945)","BPUPK dilantik (28 Mei 1945)","Sidang I BPUPK (29 Mei 1945)"]},"0.1":{t:"ord",n:"🔢 Urutan",d:["Pidato Moh. Yamin (29 Mei)","Pidato Soepomo (31 Mei)","Pidato Soekarno (1 Juni)","Panitia Sembilan dibentuk (22 Juni)","Sidang II BPUPK (10–17 Juli)"]},"0.2":{t:"scr",n:"🔤 Susun Kata",d:[["Ketua Panitia Sembilan","soekarno"],["Tokoh berpidato 31 Mei 1945","soepomo"],["Wakil ketua PPKI","hatta"]]},"0.3":{t:"ord",n:"🔢 Urutan",d:["PPKI dibentuk (7 Agustus)","Proklamasi Kemerdekaan (17 Agustus)","PPKI mengesahkan UUD 1945 (18 Agustus)"]},"1.0":{t:"scr",n:"🔤 Susun Kata",d:[["Pedoman perilaku","norma"],["Akibat melanggar aturan","sanksi"],["Tujuan adanya norma","ketertiban"]]},"1.1":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Agama","Kesusilaan","Kesopanan","Hukum"],i:[["Berpuasa Ramadan",0],["Jujur saat ujian",1],["Mengucap salam",2],["Memiliki SIM saat berkendara",3],["Berdoa sebelum belajar",0],["Menolong korban kecelakaan",1],["Tidak menyela pembicaraan",2],["Membayar pajak",3]]}},"1.2":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Di sekolah","Di rumah","Di jalan"],i:[["Memakai seragam rapi",0],["Pamit kepada orang tua",1],["Mematuhi rambu lalu lintas",2],["Mengumpulkan tugas tepat waktu",0],["Membantu pekerjaan rumah",1],["Menyeberang di zebra cross",2]]}},"2.0":{t:"scr",n:"🔤 Susun Kata",d:[["Perbedaan dalam masyarakat","keberagaman"],["Awal semboyan negara kita","bhinneka"],["Sikap menghargai perbedaan","toleransi"]]},"2.1":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Faktor geografis","Pengaruh budaya luar"],i:[["Wilayah berupa kepulauan",0],["Perbedaan bentuk muka bumi",0],["Penyebaran agama lewat perdagangan",1],["Datangnya bangsa asing",1],["Perbedaan iklim antarwilayah",0],["Interaksi antarbangsa",1]]}},"2.2":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Suku","Agama","Budaya/adat"],i:[["Jawa",0],["Sunda",0],["Hindu",1],["Buddha",1],["Rumah gadang",2],["Tari Pendet",2]]}},"2.3":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Manfaat","Tantangan"],i:[["Kekayaan budaya",0],["Prasangka antarkelompok",1],["Daya tarik wisata",0],["Konflik antarsuku",1],["Saling melengkapi",0],["Etnosentrisme",1]]}},"2.4":{t:"sort",n:"🗂️ Kelompokkan",d:{c:["Sikap baik","Sikap kurang tepat"],i:[["Menghormati teman beribadah",0],["Mengejek logat daerah",1],["Bekerja sama lintas suku",0],["Memilih teman sesuku saja",1],["Bermusyawarah saat berbeda pendapat",0],["Merendahkan budaya lain",1]]}}};
function games(v,s,i,j){const x=GX[i+'.'+j],o=[['🔗 Pasangkan',e=>game(e,s.g)],['🃏 Memory',e=>mem(e,s.g)]];if(x)o.push([x.n,e=>({ord,sort,scr})[x.t](e,x.d)]);v.innerHTML='<div class=tabs></div><div id=gv></div>';o.forEach(a=>{const b=document.createElement('button');b.className='t';b.textContent=a[0];b.onclick=()=>{v.querySelectorAll('.t').forEach(t=>t.classList.remove('on'));b.classList.add('on');a[1]($('#gv'))};v.firstChild.append(b)});v.firstChild.firstChild.click()}
function mem(el,p){const c=sh(p.flatMap((x,k)=>[[x[0],k],[x[1],k]]));let o=[],d=0,lock=0,m=0;el.innerHTML='<p>Balik dua kartu untuk menemukan pasangan istilah dan artinya.</p><div class=g></div><h3></h3>';c.forEach(z=>{const b=document.createElement('button');b.className='c';b.textContent='❓';b.onclick=()=>{if(lock||b.disabled||o.includes(b))return;b.textContent=z[0];b.classList.add('on');o.push(b);b._k=z[1];if(o.length==2){m++;lock=1;if(o[0]._k==o[1]._k){o.forEach(t=>{t.disabled=1;t.classList.add('ok')});o=[];lock=0;if(++d==p.length)el.querySelector('h3').textContent='🎉 Semua pasangan ditemukan dalam '+m+' langkah!'}else setTimeout(()=>{o.forEach(t=>{t.textContent='❓';t.classList.remove('on')});o=[];lock=0},900)}};el.querySelector('.g').append(b)})}
function ord(el,d){let n=0;el.innerHTML='<p>Ketuk peristiwa sesuai urutan, dari yang paling awal.</p><div id=ol></div><h3></h3>';sh(d).forEach(t=>{const b=document.createElement('button');b.className='c';b.textContent=t;b.onclick=()=>{if(b.disabled)return;if(t===d[n]){b.disabled=1;b.classList.add('ok');b.textContent=++n+'. '+t;if(n==d.length)el.querySelector('h3').textContent='🎉 Urutan tepat!'}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}};el.querySelector('#ol').append(b)})}
function sort(el,d){let k=0,ok=0;const it=sh(d.i);el.innerHTML='<p>Kelompokkan setiap contoh ke kategori yang tepat.</p><div class=card id=sq></div><div id=sc></div><h3 id=ss></h3>';const show=()=>{const q=el.querySelector('#sq'),c=el.querySelector('#sc');c.innerHTML='';if(k==it.length){q.textContent='';el.querySelector('#ss').textContent='🎉 Selesai! Benar '+ok+' dari '+it.length;return}q.innerHTML='<b>'+it[k][0]+'</b>';d.c.forEach((t,x)=>{const b=document.createElement('button');b.className='c';b.textContent=t;b.onclick=()=>{const r=x==it[k][1];if(r)ok++;b.classList.add(r?'ok':'no');setTimeout(()=>{k++;show()},500)};c.append(b)})};show()}
function scr(el,d){let k=0,ok=0;const go=()=>{if(k==d.length){el.innerHTML='<h3>🎉 Skor '+ok+'/'+d.length+'</h3>';return}const w=d[k][1];let s=w;while(s==w)s=sh(w.split('')).join('');el.innerHTML='<p>Susun huruf menjadi kata. Petunjuk: '+d[k][0]+'</p><h2>'+s.toUpperCase()+'</h2><input id=sa> <button class=c style="display:inline-block;width:auto" id=sb>Periksa</button><p id=sf></p>';$('#sb').onclick=()=>{const r=$('#sa').value.trim().toLowerCase()==w;if(r)ok++;$('#sf').textContent=r?'✅ Benar!':'❌ Jawaban: '+w;setTimeout(()=>{k++;go()},900)}};go()}
function login(){A.innerHTML=`<header><h1>🇮🇩 Belajar Pancasila</h1><p>SMP Muhammadiyah 2 Surabaya</p></header><div class=card><h3>Masuk</h3><p>Nama peserta didik<br><input id=nm style="width:100%;box-sizing:border-box"></p><p>Kelas<br><select id=kl style="font:inherit;padding:8px">${'ABCDEFG'.split('').map(c=>`<option>7${c}`).join('')}</select></p><button class="c sum" onclick=go()>Mulai Belajar</button></div><button class=b onclick=rekap()>📊 Rekap Nilai (Guru)</button>`}
function go(){const n=$('#nm').value.trim();if(!n)return alert('Isi nama terlebih dahulu');ME={n,k:$('#kl').value};ld();try{localStorage.setItem('me',JSON.stringify(ME))}catch(e){}home()}
async function save(id,ok,n){if(!ME)return;const p=Math.round(ok/n*100);L[id]={p,ok,n};try{localStorage.setItem(ky(),JSON.stringify(L))}catch(e){}
try{const db=await window.claude.use('db');if(!db)return;const r=db.collection('scores').doc(ME.k+'_'+ME.n.toLowerCase().replace(/[^a-z0-9]+/g,'-'));const sn=await r.get();const d=sn.data()||{nama:ME.n,kelas:ME.k,s:{}};d.s[id]={p,ok,n};await r.set(d)}catch(e){}}
function nilai(){A.innerHTML=`<button class=b onclick=home()>← Beranda</button><h2>Nilai Saya</h2><div class=card>${tbl([{nama:ME.n,s:L}])}</div><button class=c onclick="RK={k:ME.k,rows:[{nama:ME.n,s:L}]};laporan()">🖨️ Laporan Cetak</button>`}
async function rekap(k='7A'){A.innerHTML=`<button class=b onclick="ME?home():login()">← Kembali</button><h2>Rekap Nilai Kelas</h2><div class=tabs>${'ABCDEFG'.split('').map(c=>`<button class="t ${'7'+c==k?'on':''}" onclick="rekap('7${c}')">7${c}</button>`).join('')}</div><div id=rk class=card>Memuat…</div>`;let rows=[];
try{const db=await window.claude.use('db');if(db){const sn=await db.collection('scores').get();sn.docs.forEach(d=>{const x=d.data();if(x&&x.kelas==k)rows.push(x)})}}catch(e){}
if(!rows.length&&ME&&ME.k==k)rows=[{nama:ME.n,kelas:k,s:L}];rows.sort((a,b)=>a.nama.localeCompare(b.nama));window.RK={k,rows};
$('#rk').innerHTML=rows.length?tbl(rows)+'<button class=c onclick=csv()>⬇️ Unduh CSV</button> <button class=c onclick=laporan()>🖨️ Laporan Cetak</button>':'Belum ada data nilai untuk kelas ini.'}
const avg2=(s,p)=>{const v=cols.filter(c=>c[0]==p).map(c=>s[c]&&s[c].p).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):null};
function laporan(kkm){const {k,rows}=RK;kkm=+kkm||75;const tg=new Date().toLocaleDateString('id-ID',{dateStyle:'long'});
const R=rows.map(r=>{const a=avg2(r.s,'F'),b=avg2(r.s,'S'),v=[a,b].filter(x=>x!=null);return{r,a,b,t:v.length?Math.round(v.reduce((x,y)=>x+y)/v.length):null}});const ts=R.map(x=>x.t).filter(x=>x!=null),n=x=>x==null?'-':x;
A.innerHTML=`<div class=np><button class=b onclick="rekap('${k}')">← Kembali</button> KKM <input type=number value=${kkm} style="width:70px" onchange="laporan(this.value)"> <button class="c sum" style="display:inline-block;width:auto" onclick=window.print()>🖨️ Cetak</button><br><small>Jika tombol cetak tidak merespons, gunakan menu Cetak atau Ctrl+P pada peramban.</small></div><div class=rpt><h2 style="text-align:center">LAPORAN HASIL BELAJAR<br>Pendidikan Pancasila Kelas 7</h2><p style="text-align:center">SMP Muhammadiyah 2 Surabaya · Kelas ${esc(k)} · ${tg}</p><div class=ox><table><tr><th rowspan=2>No<th rowspan=2>Nama${D.map(b=>`<th colspan=${b.s.length+1}>${b.n}`).join('')}<th colspan=3>Rata-rata<th rowspan=2>Ket.<tr>${cols.map(c=>'<th>'+c).join('')}<th>F<th>S<th>Akhir${R.map((x,i)=>`<tr><td>${i+1}<td>${esc(x.r.nama)}${cols.map(c=>'<td>'+(x.r.s[c]?x.r.s[c].p:'-')).join('')}<td>${n(x.a)}<td>${n(x.b)}<td><b>${n(x.t)}</b><td>${x.t==null?'-':x.t>=kkm?'Tuntas':'Belum tuntas'}`).join('')}</table></div><p>Jumlah siswa: ${R.length} · Rata-rata kelas: ${ts.length?Math.round(ts.reduce((a,b)=>a+b)/ts.length):'-'} · Tertinggi: ${ts.length?Math.max(...ts):'-'} · Terendah: ${ts.length?Math.min(...ts):'-'} · Tuntas: ${ts.filter(t=>t>=kkm).length}/${R.length} (KKM ${kkm})</p><p><small>F = rata-rata tes formatif, S = tes sumatif (kolom: bab.sub bab). Skala 0–100; tes yang diulang memakai nilai terakhir.</small></p><div style="display:flex;justify-content:space-between;margin-top:30px"><div>Mengetahui,<br>Kepala Sekolah<br><br><br>(................................)</div><div>Surabaya, ${tg}<br>Guru Mata Pelajaran<br><br><br>(................................)</div></div></div>`}
async function csv(){const {k,rows}=RK,t=['Nama','Kelas',...cols,'Rata-rata'].join(',')+'\n'+rows.map(x=>['"'+x.nama+'"',k,...cols.map(c=>x.s[c]?x.s[c].p:''),avg(x.s)].join(',')).join('\n');try{const d=await window.claude.use('downloads');if(d)await d.save({filename:'rekap-'+k+'.csv',data:t})}catch(e){}}
function game(el,p){let sel=null,done=0;el.innerHTML='<p>Ketuk satu kartu di kiri, lalu pasangannya di kanan.</p><div class=g><div id=l></div><div id=r></div></div><h3 id=gs></h3>';
const mk=(c,t,x)=>{const b=document.createElement('button');b.className='c';b.textContent=t;b.onclick=()=>{if(b.disabled)return;if(c=='#l'){el.querySelectorAll('#l .on').forEach(e=>e.classList.remove('on'));b.classList.add('on');sel={x,b}}else if(sel){if(sel.x===x){b.disabled=sel.b.disabled=true;b.classList.add('ok');sel.b.classList.remove('on');sel.b.classList.add('ok');sel=null;if(++done==p.length)$('#gs').textContent='🎉 Semua pasangan benar!'}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}}};el.querySelector(c).append(b)};
sh(p).forEach(x=>mk('#l',x[0],x));sh(p).forEach(x=>mk('#r',x[1],x))}
home();
